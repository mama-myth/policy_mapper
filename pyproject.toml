[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-to-code-mapper"
version = "0.1.0"
description = "A Context-Aware IDE Assistant for Real-Time Security and Policy Guidance"
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
